<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conectando TikTok con videoremotion...</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1317;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      background: #14181d;
      border: 1.5px solid #22c55e;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }
    h2 { color: #4ade80; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.5; font-size: 14px; }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      background: #06b6d4;
      color: #0f172a;
      font-weight: 800;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔄 Finalizando conexión con TikTok...</h2>
    <p id="status">Redirigiendo código OAuth a tu estudio local (puerto 4001)...</p>
    <a id="manualLink" class="btn" href="#">Continuar al Estudio Local</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var currentRedirectUri = window.location.origin + window.location.pathname;
      params.set("redirect_uri", currentRedirectUri);
      var target = "http://localhost:4001/api/oauth/tiktok/callback?" + params.toString();
      var link = document.getElementById("manualLink");
      if (link) link.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
